name: diagram-design
skill_version: "2.6"
applies_to:
  - gpt-5-class models via Codex CLI / IDE
  - OpenAI API agents with file and code-execution tools
  - other OpenAI-compatible harnesses that load Agent Skills

prompt_format_notes:
  - The skill is prompt content plus local reference files; there is no
    OpenAI-specific tool surface to adapt. SKILL.md and references/ load the
    same under any harness.
  - SKILL.md is ~30KB and built for progressive disclosure. Read SKILL.md
    first, then load only the type reference (type-*.md) and semantic reference
    the task needs. Do not preload all 60 references.

capability_differences:
  - Upstream ships Claude Code slash commands in commands/ (doctor,
    export-diagram, import-drawio, import-excalidraw, import-mermaid, profile).
    They are not bundled here. Their logic lives in references/doctor.md,
    references/export.md, references/import-*.md, and references/profiles.md,
    so follow those references directly instead of the command files.
  - Codex-style harnesses have no /command surface; treat each upstream command
    as a named procedure backed by its reference doc.
  - PNG export requires Playwright plus Chromium in the execution environment
    (see references/export.md). SVG export via scripts/export_svg.py is pure
    Python 3 stdlib. If the harness lacks Playwright, deliver HTML/SVG and note
    the PNG limitation.

behavioral_notes:
  - Section 0 of SKILL.md is a style-guide gate. On the first diagram in a new
    project, ask the user to customize branding (website URL, design-system
    folder, pasted tokens, saved profile, or keep default). In autonomous or
    headless runs where asking is impossible, fall back to the shipped default
    tokens and say so in the reply.
  - Diagrams are generated as self-contained HTML with inline SVG; the skill
    forbids remote assets beyond the approved Google Fonts stylesheet.
    Agents with network-restricted sandboxes should prefer system font stacks
    or note the font substitution.
  - Run scripts/self_check.py against every generated diagram before delivery;
    it is stdlib-only and fast.
  - The skill explicitly defers quick unicode diagrams to wiretext and
    attribute-only before/after comparisons to tables; do not force a diagram
    where prose or a table serves better.
