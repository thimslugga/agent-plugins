interface:
  display_name: "Impeccable"
  short_description: "Design guidance for AI coding agents: 24 design commands plus a deterministic UI anti-pattern detector"
  upstream: "https://github.com/pbakaus/impeccable"
  version: "4.5.1"
  license: "Apache 2.0"

applies_to:
  models: "OpenAI-based agents (gpt-5.x, Codex CLI) consuming this skill"

adaptation_notes:
  - "No slash-command runner here: there is no /impeccable command surface in this harness. Invoke the skill by reading SKILL.md and following its Setup and workflow directly."
  - "Launcher path is skill-relative: run <skill-dir>/scripts/impeccable <verb> with cwd at the user's project. On Windows shells without sh, use scripts/impeccable.cmd."
  - "The frontmatter allowed-tools entries (Bash(npx impeccable *), Bash(scripts/impeccable *)) are Claude Code permission patterns; treat them as 'these shell commands are permitted', not as literal tool names."
  - "Engine binary is bundled for linux-x64 at scripts/bin/linux-x64/impeccable. On other platforms the launcher downloads the pinned engine once into ~/.impeccable/bin/ on first run; no Node runtime is required."
  - "Hook manifests (PostToolUse/Stop detector runs on Claude Code, Cursor, Codex, Copilot, Grok) are not installed in this harness. Run scripts/impeccable detect explicitly instead."
  - "Live mode (live, generate) needs a local dev server plus an installed Chrome/Chromium/Edge; it never injects into production sites."
  - "The skill's agents/ subagents (asset-producer, documenter, finish-reviewer, manual-edit-applier) are not bundled in this port; reference/degraded/ carries inline fallbacks for each."
  - "argument-hint lists the 24 commands grouped by category; pass the command name and target as plain text, e.g. 'audit the checkout form'."

capability_differences:
  - "Image generation is not assumed: comp-first flows that need generated comps degrade to code-first when the harness has no image model."
  - "No browser automation tool is assumed beyond what this harness provides; URL scans in detect use the engine's own bundled browser driver scripts, not the harness browser."
