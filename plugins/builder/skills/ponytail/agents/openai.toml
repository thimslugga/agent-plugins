# OpenAI agent adaptation notes for the ponytail skill.

[skill]
applies_to = ["gpt-5", "gpt-5-codex", "codex"]
requires_shell = false
requires_network = false

[notes]
# The skill is a pure behavioral posture: no scripts, no tools, no network.
# Activation phrases: "ponytail", "be lazy", "lazy mode", "simplest solution",
# "minimal solution", "yagni", "do less", "shortest path", or complaints about
# over-engineering, bloat, boilerplate, or unnecessary dependencies.
# Intensity argument: lite | full | ultra. Default is full when no level given.
# "stop ponytail" / "normal mode" deactivates; the level persists until changed
# or the session ends. Persistence ("ACTIVE EVERY RESPONSE") means the agent
# holds the posture across turns once activated, not re-derives it.
# Output contract: code first, then at most three short lines naming what was
# skipped and when to add it. Explanations the user explicitly asked for
# (reports, walkthroughs) are exempt and given in full.
# Ponytail governs code decisions only, not prose style and not non-coding
# requests (general knowledge, prose, translation, summaries, recipes).
# Never simplify away: input validation at trust boundaries, error handling
# that prevents data loss, security measures, accessibility basics, or
# anything explicitly requested.
# Bug fix = root cause: trace every caller of the touched function and fix
# once, where all callers route through.
