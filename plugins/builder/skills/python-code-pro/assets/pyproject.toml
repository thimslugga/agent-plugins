# python-code-pro project template.
#
# Placeholders — substituted by scripts/init-config (or replace by hand, then
# confirm none remain with: grep -rn __PROJECT_NAME__ __SOURCE_DIR__ .):
#   __PROJECT_NAME__  distribution name, e.g. "my-tool"
#   __SOURCE_DIR__    top-level source directory, e.g. "src"
#
# Everything else is the shared standard: ruff (lint + format), ty, mypy
# strict. Base adapted from a real project config; project-specific choices
# were parameterized or demoted to commented examples.

[project]
name = "__PROJECT_NAME__"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.uv]
exclude-newer = "3 days"
index-strategy = "first-index"
# Let one fast-moving dep float past the freeze window, e.g.:
#exclude-newer-package = { somepkg = false }

[tool.ruff]
line-length = 100
indent-width = 4
# target-version is inferred from [project].requires-python; set it here only if you don't declare that.
#target-version = "py312"
include = ["pyproject.toml", "__SOURCE_DIR__/**/*.py"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".cache",
    ".mypy_cache",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".rumdl_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    ".codex",
    ".github",
    ".claude",
    ".kiro",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "target",
    "node_modules",
    "site-packages",
    "vendor",
    "third-party",
    "venv",
]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or McCabe complexity (`C901`) by default.
# Keep the select list in sync with assets/pyproject-script.toml.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "N",        # pep8-naming
    "I",        # isort
    "B",        # bugbear
    "Q",        # flake8-quotes (formatter-conflicting codes ignored below)
    "C4",       # comprehensions
    "FA",       # future annotations
    "DTZ",      # naive datetimes
    "LOG",      # flake8-logging
    "G",        # logging format (G004: no f-strings in logs)
    "EM",       # exception messages
    "S",        # bandit
    "UP",       # pyupgrade
    "SIM",      # simplify
    "PTH",      # pathlib
    "RET",      # returns
    "ARG",      # unused arguments
    "D",        # pydocstyle
    "ANN",      # annotations
    "TID",      # tidy imports / banned-api
    "PGH",      # pygrep hooks (blanket noqa / type: ignore)
    "RUF",      # ruff-specific
    "C90",      # mccabe
    "PL",       # pylint (includes PLE1205/PLE1206)
    "EXE",      # executable/shebang
    "PYI",      # stub files
    "T20",      # print / breakpoint
    "BLE",      # blind except
    "TRY",      # exception anti-patterns
    "ASYNC",    # blocking calls in async
    "PT",       # pytest style
    "ERA",      # commented-out code
    "PERF",     # performance anti-patterns
]
ignore = [
    # Conflict with / redundant under `ruff format`
    "W191", "E111", "E114", "E117", "D206", "D300",
    "Q000", "Q001", "Q002", "Q003",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Tell Ruff about loggers it can't infer from the variable name,
# e.g. a logger imported from your own module:
#logger-objects = ["myapp.log.logger"]
# isort: declare your first-party package so src-layout imports sort
# correctly, e.g.:
#isort = { combine-as-imports = true, known-first-party = ["mypackage"] }

[tool.ruff.lint.per-file-ignores]
"__SOURCE_DIR__/test_*.py" = ["S101", "ANN", "D", "ARG", "PLR2004"]
"**/cli.py" = ["T201"]   # CLIs may print

[tool.ruff.lint.pydocstyle]
convention = "google"
# Add your own property-like decorators so D401 skips them too:
# property-decorators = ["functools.cached_property"]

[tool.ruff.lint.pep8-naming]
# Framework-dictated names (ast.NodeVisitor, docutils, etc.); unittest names are ignored by default
extend-ignore-names = ["visit_*", "generic_visit", "depart_*"]

# forces leaner functions
[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.path".msg = "Use pathlib.Path"
# Declare your project's library standards here by banning the alternative, e.g.:
#"httpx".msg = "Use requests (project standard)"
#"requests".msg = "Use httpx (project standard)"
#"django".msg = "Use flask (project standard)"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ty.rules]
index-out-of-bounds = "ignore"

# See https://mypy.readthedocs.io/en/latest/config_file.html for more mypy options.
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
enable_error_code = ["explicit-override"]
# Where mypy resolves first-party imports (matches your source layout)
mypy_path = "__SOURCE_DIR__"
# Optional third-party integrations: don't fail strict typecheck on
# untyped/optional deps, e.g.:
#[[tool.mypy.overrides]]
#module = ["sounddevice", "sounddevice.*"]
#ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "asyncio: marks tests that use asyncio",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
asyncio_mode = "strict"
testpaths = ["__SOURCE_DIR__"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=__SOURCE_DIR__ --cov-report=term-missing --cov-fail-under=90 -m 'not e2e'"
# Expected warnings you don't want failing the suite, e.g.:
#filterwarnings = [
#    "ignore:some warning you expect:RuntimeWarning",
#]

[tool.coverage.run]
omit = ["__SOURCE_DIR__/test_*.py"]

[tool.coverage.report]
exclude_also = [
    # Only executed while typechecking
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
    "raise NotImplementedError",
]
