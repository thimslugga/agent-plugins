# ~/.config/environment.d/50-example.conf -- systemd user environment (Linux).
#
# Read by the systemd user manager at login: applies to user services and to
# graphical sessions that import it (GNOME on Wayland does). No shell needed,
# so GUI apps started from the launcher see these values.
#
# NOT a shell script: KEY=value lines only. ${VAR} and ${VAR:-default}
# expansion work; commands, 'export', conditionals and quotes-as-syntax do not.
# Check the result with: systemctl --user show-environment
# Takes effect at next login.

EDITOR=vim
PATH=${HOME}/.local/bin:${PATH}
